name: npm token expiry reminder

# Runs every Monday at 9am UTC.
#
# It does two things, and which one wins matters:
#
#   1. PROBES the token for real with `npm whoami`. This is the authority.
#   2. Reads the hand-maintained date in .github/npm-token-meta.json, purely as
#      an early warning so a renewal can be scheduled before anything breaks.
#
# The probe exists because the date on its own failed exactly as you would
# expect. The token was renewed on 2026-09-09 without npm-token-meta.json being
# updated, so the file still claimed 2026-08-24. From 2026-09-14 this workflow
# opened issue #61 announcing the token had expired 21 days earlier, and held it
# open, while that same token was live and published 10.0.0 and 10.0.1 on
# 2026-09-30. A reminder that cries wolf gets muted, and then the real expiry
# passes unnoticed.
#
# So a LIVE token closes the reminder even if the date disagrees, and a DEAD
# token opens it even if the date says there is time left. The date can rot; the
# probe cannot.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # The authority on whether the token works. `npm whoami` is read-only and
      # fails on an expired, revoked or malformed token, which is the one thing
      # a date in a file cannot tell us.
      - name: Probe the token
        id: probe
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "alive=false" >> $GITHUB_OUTPUT
            echo "reason=NPM_TOKEN secret is not set" >> $GITHUB_OUTPUT
            exit 0
          fi
          if WHO=$(npm whoami --registry=https://registry.npmjs.org 2>&1); then
            echo "alive=true" >> $GITHUB_OUTPUT
            echo "reason=authenticated as $WHO" >> $GITHUB_OUTPUT
            echo "Token is LIVE ($WHO)."
          else
            echo "alive=false" >> $GITHUB_OUTPUT
            echo "reason=npm whoami failed: $WHO" >> $GITHUB_OUTPUT
            echo "Token is DEAD: $WHO"
          fi

      - name: Read expiry metadata
        id: meta
        run: |
          EXPIRES_AT=$(jq -r '.expiresAt' .github/npm-token-meta.json)
          REMINDER_DAYS=$(jq -r '.renewalReminderDays' .github/npm-token-meta.json)
          TODAY=$(date -u +%Y-%m-%d)
          EXPIRE_TS=$(date -d "$EXPIRES_AT" +%s)
          TODAY_TS=$(date -d "$TODAY" +%s)
          DAYS_LEFT=$(( (EXPIRE_TS - TODAY_TS) / 86400 ))
          echo "expires_at=$EXPIRES_AT"     >> $GITHUB_OUTPUT
          echo "days_left=$DAYS_LEFT"       >> $GITHUB_OUTPUT
          echo "reminder_days=$REMINDER_DAYS" >> $GITHUB_OUTPUT
          echo "Token expires $EXPIRES_AT — $DAYS_LEFT days left (reminder threshold: $REMINDER_DAYS days)"

      - name: Ensure reminder label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "npm-token-renewal" \
            --repo helloimjolopez-collab/pathway-ds \
            --color "e11d48" \
            --description "npm publish token needs renewal" 2>/dev/null || true

      - name: Open reminder issue (if expiring soon and not already open)
        if: ${{ steps.probe.outputs.alive != 'true' || fromJson(steps.meta.outputs.days_left) <= fromJson(steps.meta.outputs.reminder_days) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAYS_LEFT="${{ steps.meta.outputs.days_left }}"
          EXPIRES_AT="${{ steps.meta.outputs.expires_at }}"

          EXISTING=$(gh issue list \
            --repo helloimjolopez-collab/pathway-ds \
            --label "npm-token-renewal" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -eq 0 ]; then
            USED_IN=$(jq -r '.usedIn[] | "- **\(.secretName)** in `\(.repo)` — \(.description)"' .github/npm-token-meta.json)

            gh issue create \
              --repo helloimjolopez-collab/pathway-ds \
              --title "🔑 npm token expires in ${DAYS_LEFT} day(s) — renewal needed by ${EXPIRES_AT}" \
              --label "npm-token-renewal" \
              --body "## npm token renewal needed

          The npm publish token expires on **\`${EXPIRES_AT}\`** — **${DAYS_LEFT} day(s)** from today.

          If not renewed, \`publish-tokens.yml\` will silently fail with a 404 error.

          ---

          ### How to renew (2 minutes)

          1. Go to [npmjs.com → Access Tokens → Generate New Token](https://www.npmjs.com/settings/helloimjolopez_pathway/tokens/granular-access-tokens/new)
          2. Fill in:
          - **Token name**: \`pathway-ds-publish\`
          - **Bypass 2FA**: ✅ checked
          - **Packages and scopes → Permissions**: Read and write
          - **Expiration**: 90 days
          3. Copy the token (starts with \`npm_...\`)
          4. Tell Claude: \`here is my new npm token: npm_xxx\`

          Claude will read \`.github/npm-token-meta.json\`, update every location below, update the expiry date, commit, and push — one step.

          ---

          ### Locations this token is used

          ${USED_IN}

          ---

          *This issue was opened automatically by \`.github/workflows/npm-token-reminder.yml\`.*
          *It will close itself once the token is renewed and the expiry date in \`npm-token-meta.json\` is updated.*"
          else
            echo "Reminder issue already open — skipping."
          fi

      - name: Close stale reminder issues (token is fine)
        if: ${{ steps.probe.outputs.alive == 'true' && fromJson(steps.meta.outputs.days_left) > fromJson(steps.meta.outputs.reminder_days) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo helloimjolopez-collab/pathway-ds \
            --label "npm-token-renewal" \
            --state open \
            --json number \
            --jq '.[].number' | \
          xargs -r -I{} gh issue close {} \
            --repo helloimjolopez-collab/pathway-ds \
            --comment "Token has been renewed (expiry updated in \`npm-token-meta.json\`). Closing." \
            2>/dev/null || true
