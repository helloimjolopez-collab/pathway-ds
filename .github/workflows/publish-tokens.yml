name: Publish pathway-tokens to npm

# Triggered manually from the Actions tab.
# Choose the version bump type — patch for token value changes,
# minor for new tokens added, major for breaking renames.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Bump version in package.json
        run: |
          BUMP="${{ github.event.inputs.bump }}"
          CURRENT=$(jq -r '.version' package.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          if [ "$BUMP" = "major" ]; then NEW="$((MAJOR+1)).0.0"
          elif [ "$BUMP" = "minor" ]; then NEW="${MAJOR}.$((MINOR+1)).0"
          else NEW="${MAJOR}.${MINOR}.$((PATCH+1))"
          fi
          jq --arg v "$NEW" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          echo "NEW_VERSION=$NEW" >> $GITHUB_ENV

      - name: Build tokens (Style Dictionary)
        run: node style-dictionary.config.js

      - name: Build dist/
        run: node scripts/build-dist.js

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/tokens/
          git commit -m "chore(release): v${{ env.NEW_VERSION }} [skip ci]"
          git tag "v${{ env.NEW_VERSION }}"
          git fetch origin main
          git rebase origin/main
          git push origin main --follow-tags

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
