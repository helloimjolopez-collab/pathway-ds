name: Deploy Storybook to GitHub Pages

# Builds Storybook and commits the output into the /storybook/ folder
# on the main branch. This keeps existing pages (SideNav demos, docs, specs)
# untouched while adding Storybook at /storybook/.

on:
  push:
    branches: [main]
    paths:
      - "tokens/pathway-design-tokens.json"
      - "src/**"
      - ".storybook/**"
      - "components/**"
      - "docs/**"
      - "style-dictionary.config.js"
      - "package.json"
  workflow_run:
    workflows: ["Sync design tokens from Figma export"]
    types: [completed]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build tokens (Style Dictionary)
        run: node style-dictionary.config.js

      - name: Build Storybook
        run: npx storybook build
        env:
          STORYBOOK_ASSET_PREFIX: /pathway-ds/storybook

      - name: Deploy Storybook into /storybook/ folder on main
        run: |
          # Remove old storybook folder if it exists
          rm -rf storybook

          # Move built output into /storybook/
          mv storybook-static storybook

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storybook/
          if git diff --cached --quiet; then
            echo "No Storybook changes — skipping commit."
          else
            git commit -m "chore: deploy Storybook [skip ci]"
            git push
          fi
