<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinner &amp; Skeleton — Pathway Design System</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <!-- Pathway tokens: the real built CSS. Never inline a hand-copied subset -->
  <link rel="stylesheet" href="../../src/tokens/primitives.css" />
  <link rel="stylesheet" href="../../src/tokens/themes/light.css" />
  <link rel="stylesheet" href="../../src/tokens/themes/midnight.css" />
  <link rel="stylesheet" href="../../src/tokens/layout.css" />
  <link rel="stylesheet" href="../../src/tokens/layout-contextual.css" />
  <link rel="stylesheet" href="../../src/tokens/layout-responsive.css" />
  <link rel="stylesheet" href="../../src/tokens/type.css" />
  <link rel="stylesheet" href="../../src/tokens/motion.css" />
  <link rel="stylesheet" href="../../src/tokens/breakpoints.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
  /* Match Figma's text rendering. Without these, Medium (500) renders visibly
     heavier in a browser than in Figma. Every standalone demo declares them
     itself, because an iframed demo inherits nothing from Storybook. */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
    min-height: 100%;
    background: var(--semantic-color-fill-surface-canvas);
    color: var(--semantic-color-foreground-static-neutral-base);
    font-family: var(--semantic-type-family-brand);
  }
  #root { padding: var(--semantic-layout-units-padding-wide); }
  h1 { font-size: var(--semantic-type-font-size-xl); font-weight: var(--semantic-type-weight-semibold);
       color: var(--semantic-color-foreground-static-neutral-bold); margin-bottom: var(--semantic-layout-units-gap-tight); }
  h2 { font-size: var(--semantic-type-font-size-m); font-weight: var(--semantic-type-weight-semibold);
       color: var(--semantic-color-foreground-static-neutral-bold);
       margin: var(--semantic-layout-units-padding-wide) 0 var(--semantic-layout-units-gap-tight); }
  p  { font-size: var(--semantic-type-font-size-r); line-height: var(--semantic-type-line-height-m-relaxed);
       color: var(--semantic-color-foreground-static-neutral-subtle); max-width: 70ch; }
  .card { background: var(--semantic-color-fill-surface-elevated);
          border: 0.5px solid var(--semantic-color-stroke-static-neutral-base);
          border-radius: var(--semantic-layout-units-cornerradius-large);
          padding: var(--semantic-layout-units-padding-base); }
  .row { display: flex; align-items: center; gap: var(--semantic-layout-units-gap-wide); flex-wrap: wrap; }
  .lbl { font-size: var(--semantic-type-font-size-xs);
         letter-spacing: var(--semantic-type-letter-spacing-wide);
         color: var(--semantic-color-foreground-static-neutral-subtle); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/**
 * spinner.jsx — the React module Spinner never had, with NewCo's ring loader.
 *
 * WHY THIS EXISTS
 * Spinner shipped as HTML/SVG/CSS only; the manifest said a .jsx wrapper was on
 * the backlog. Jo asked for NewCo's spinner and loading states to be brought
 * into the repo, and NewCo's loader is a RING, not the sunburst Amplify has. So
 * both live here as variants rather than as two components: a caller picks the
 * shape, and everything else about the contract is shared.
 *
 * WHERE THE NEWCO DESIGN CAME FROM
 * The NewCo and Spired design concept. It is NOT in the newco-ds repo (checked
 * local and origin, no spinner, skeleton or shimmer at any depth and no commit
 * mentioning them), so the geometry and timings are transcribed from the
 * concept: three arcs at 0.32, 0.19 and 0.09 of the circumference, offset 0,
 * 0.4 and 0.68, turning at 1.4s linear. It reads as the mark's DNA, one long,
 * one medium and one short pill, arranged in a ring.
 *
 * WHAT CHANGED COMING ACROSS, AND WHY IT IS BETTER
 * The concept painted its three arcs with hardcoded NewCo purples: three rungs of a `purple` primitive ramp that
 * Pathway does not have at all (and #6E64BE is in fact NewCo's own Brand/400).
 * Here the arcs are currentColor at
 * three stroke opacities, so the ring inherits whatever the tone and emphasis
 * resolve to. That means it renders Amplify blue under Amplify and NewCo purple
 * under NewCo with no branching, and it also answers every tone the sunburst
 * does, which the hardcoded version could not.
 */

/** The tones Spinner answers to. Mirrors spinner.html. */
const TONES = [
  "neutral", "brand", "info", "warning", "danger", "negative", "positive",
  "accent-amethyst", "accent-jade", "accent-seabreeze",
];
const EMPHASES = ["light", "subtle", "base", "contrast", "bold"];

const c = (n) => `var(--semantic-color-${n})`;

/**
 * tone + emphasis -> the ONE colour token the spinner takes.
 *
 * Only `neutral` has a real emphasis ramp. Every other tone resolves to a
 * single token at all five emphases, and that is deliberate rather than
 * unfinished: those families have no foreground ladder to ramp through. The
 * prop is still accepted so a caller can pass emphasis uniformly without
 * special-casing neutral.
 */
const TONE = {
  neutral: {
    light: c("foreground-static-neutral-faint"),
    subtle: c("foreground-static-neutral-base"),
    base: c("foreground-static-neutral-base"),
    contrast: c("foreground-static-neutral-strong"),
    bold: c("foreground-static-neutral-bold"),
  },
  brand: c("foreground-action-primary-on-subtle-rest"),
  info: c("foreground-static-info-on-subtle"),
  warning: c("foreground-static-attention-on-subtle"),
  danger: c("foreground-static-negative-on-subtle"),
  negative: c("foreground-static-negative-on-subtle"),
  positive: c("foreground-static-positive-on-subtle"),
  "accent-amethyst": c("foreground-static-info-on-subtle"),
  "accent-jade": c("foreground-static-accent-jade-on-subtle"),
  "accent-seabreeze": c("foreground-static-accent-seabreeze-on-subtle"),
};

function colourFor(tone, emphasis) {
  const entry = TONE[tone] ?? TONE.neutral;
  if (typeof entry === "string") return entry;
  return entry[emphasis] ?? entry.base;
}

/**
 * Amplify's sunburst. Eight spokes on a 12x12 viewBox with an opacity ladder
 * from 1.00 down to 0.12, which breaks the 8-fold rotational symmetry so that
 * rotating the whole SVG reads as a head with a fading trail.
 */
const SUNBURST = [
  { d: "M6 1V3", opacity: 1.0 },
  { d: "M8.1 3.9L9.55 2.45", opacity: 0.87 },
  { d: "M9 6H11", opacity: 0.75 },
  { d: "M8.1 8.1L9.55 9.55", opacity: 0.62 },
  { d: "M6 9V11", opacity: 0.5 },
  { d: "M2.45 9.55L3.9 8.1", opacity: 0.37 },
  { d: "M1 6H3", opacity: 0.25 },
  { d: "M2.45 2.45L3.9 3.9", opacity: 0.12 },
];

/** NewCo's ring: one long, one medium, one short arc. */
const RING = [
  { frac: 0.32, off: 0.0, opacity: 1 },
  { frac: 0.19, off: 0.4, opacity: 0.7 },
  { frac: 0.09, off: 0.68, opacity: 0.45 },
];

/**
 * @param {"ring"|"sunburst"} variant  ring is NewCo's, sunburst is Amplify's
 * @param {number|string} size         px number or any CSS length; default 1em
 * @param {string} tone                one of TONES
 * @param {string} emphasis            one of EMPHASES; only neutral ramps
 * @param {string} label               announced by screen readers
 */
function Spinner({
  variant = "ring",
  size,
  tone = "neutral",
  emphasis = "base",
  label = "Loading",
  className,
  style,
}) {
  // Invalid values are surfaced loudly rather than rendering as `color: unset`,
  // which is invisible and would look like the spinner simply failed to paint.
  if (!TONES.includes(tone)) {
    console.error(`[Spinner] Invalid tone "${tone}". Allowed: ${TONES.join(", ")}`);
  }
  if (!EMPHASES.includes(emphasis)) {
    console.error(`[Spinner] Invalid emphasis "${emphasis}". Allowed: ${EMPHASES.join(", ")}`);
  }

  const box = size == null ? "1em" : typeof size === "number" ? `${size}px` : size;
  const common = {
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    width: box, height: box, flexShrink: 0,
    color: colourFor(tone, emphasis),
  };

  // 24 units of viewBox for the ring so the stroke maths stay whole numbers.
  const V = 24, STROKE = 2.5;
  const r = (V - STROKE) / 2;
  const circ = 2 * Math.PI * r;

  return (
    <span
      role="status"
      aria-live="polite"
      aria-label={label}
      className={className}
      data-tone={tone}
      data-emphasis={emphasis}
      data-variant={variant}
      style={{ ...common, ...style }}
    >
      {variant === "sunburst" ? (
        <svg
          viewBox="0 0 12 12" width="100%" height="100%" aria-hidden="true" focusable="false"
          style={{ animation: "pw-spin var(--motion-duration-loop) var(--motion-easing-linear) infinite" }}
        >
          {SUNBURST.map((s, i) => (
            <path key={i} d={s.d} opacity={s.opacity} stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
          ))}
        </svg>
      ) : (
        <svg
          viewBox={`0 0 ${V} ${V}`} width="100%" height="100%" fill="none" aria-hidden="true" focusable="false"
          // 1.4s linear, from the concept. Linear is correct for a continuous
          // loop: any eased curve makes a constant rotation appear to stutter
          // once per revolution. motion.css reserves easing-linear for exactly
          // this and says so.
          style={{ animation: "pw-spin 1400ms var(--motion-easing-linear) infinite" }}
        >
          {RING.map((s, i) => (
            <circle
              key={i}
              cx={V / 2} cy={V / 2} r={r}
              stroke="currentColor" strokeOpacity={s.opacity}
              strokeWidth={STROKE} strokeLinecap="round"
              strokeDasharray={`${s.frac * circ} ${circ}`}
              strokeDashoffset={-s.off * circ}
            />
          ))}
        </svg>
      )}
      <span
        style={{
          position: "absolute", width: 1, height: 1, padding: 0, margin: -1,
          overflow: "hidden", clip: "rect(0 0 0 0)", whiteSpace: "nowrap", border: 0,
        }}
      >
        {label}
      </span>
    </span>
  );
}

/**
 * The keyframes both variants need, plus the reduced-motion opt-out.
 *
 * Returned as a component rather than injected on import, because a module with
 * an import side effect cannot be tree-shaken and would push CSS into any
 * bundle that merely referenced the file. Mount it once per document.
 */
function SpinnerKeyframes() {
  return (
    <style>{`
      @keyframes pw-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        [role="status"][data-variant] svg { animation: none !important; }
      }
    `}</style>
  );
}



/**
 * skeleton.jsx — NewCo's loading placeholder, brought across token-pure.
 *
 * A skeleton stands in for content that has not arrived: a block the shape of
 * the thing it replaces, with a light travelling across it so the wait reads as
 * progress rather than as a broken layout.
 *
 * WHERE THE DESIGN CAME FROM
 * The NewCo and Spired design concept. It is NOT in the newco-ds repo, which
 * has no skeleton, shimmer or spinner at any depth and no commit mentioning
 * them, so the geometry and timings are transcribed from the concept:
 *
 *   a 45deg band sweeping bottom-left to top-right, 3.8s, easing-breath,
 *   with a -1.6s delay so a freshly mounted skeleton is already mid-sweep
 *   instead of starting dark.
 *
 * The 45deg ORIENTATION matters and is not decorative. The band is
 * perpendicular to its own travel, so it reads as a diagonal sweep rising,
 * which is the brand's ascent motion. A vertical band travelling sideways is
 * the generic shimmer every library ships and is not this.
 *
 * WHAT CHANGED COMING ACROSS
 * The concept hardcoded its colours: a `warm` primitive ramp rung for the base,
 * which Pathway does not have at all, and two literal rgba() stops, a lavender
 * rgba(150,145,245,0.22) and a warm grey rgba(148,144,138,0.14). Here the base
 * is a semantic fill and the band is color-mix over tokens, so the sweep picks
 * up the brand tint in whichever brand is active and inverts correctly in
 * Midnight. Nothing is hardcoded, so nothing has to be maintained twice.
 */

const SHEEN = "var(--semantic-color-foreground-static-brand-on-subtle)";
const HAZE = "var(--semantic-color-foreground-static-neutral-subtle)";

/**
 * One skeleton block.
 *
 * @param {number|string} width   defaults to 100%
 * @param {number|string} height  defaults to 12px, a text-line's worth
 * @param {number|string} radius  defaults to the base corner radius
 * @param {boolean} circle        square it off and fully round it, for avatars
 */
function Skeleton({ width = "100%", height = 12, radius, circle = false, className, style }) {
  const len = (v) => (typeof v === "number" ? `${v}px` : v);
  const side = circle ? len(height) : len(width);
  return (
    <span
      aria-hidden="true"
      className={className}
      style={{
        position: "relative",
        display: "block",
        overflow: "hidden",
        width: side,
        height: len(height),
        flexShrink: 0,
        background: "var(--semantic-color-fill-static-neutral-strong)",
        borderRadius: circle
          ? "var(--semantic-layout-units-cornerradius-full)"
          : radius != null
          ? len(radius)
          : "var(--semantic-layout-units-cornerradius-base)",
        ...style,
      }}
    >
      <span className="pw-skeleton__sheen" aria-hidden="true" />
    </span>
  );
}

/**
 * Several lines of placeholder text.
 *
 * The last line is short on purpose: real paragraphs do not end flush with the
 * measure, and a stack of equal-length bars reads as a table rather than prose.
 */
function SkeletonText({ lines = 3, lastLineWidth = "45%", gap, className, style }) {
  return (
    <span
      className={className}
      style={{
        display: "flex",
        flexDirection: "column",
        gap: gap != null ? (typeof gap === "number" ? `${gap}px` : gap) : "var(--semantic-layout-units-gap-tight)",
        ...style,
      }}
    >
      {Array.from({ length: lines }, (_, i) => (
        <Skeleton key={i} width={i === lines - 1 ? lastLineWidth : "100%"} />
      ))}
    </span>
  );
}

/**
 * The sweep's keyframes and the band itself.
 *
 * A component rather than an import side effect, for the same reason as
 * SpinnerKeyframes: a module that injects CSS on import cannot be tree-shaken.
 * Mount it once per document.
 *
 * `inset: -80%` is what lets a band rotated 45deg still cover the corners of
 * its box through the whole travel. Inset 0 and the corners go unlit.
 */
function SkeletonKeyframes() {
  return (
    <style>{`
      @keyframes pw-skeleton-sheen {
        0%   { transform: translate(-42%, 42%); }
        100% { transform: translate(42%, -42%); }
      }
      .pw-skeleton__sheen {
        content: ""; position: absolute; inset: -80%;
        background: linear-gradient(
          45deg,
          transparent 40%,
          color-mix(in srgb, ${SHEEN} 22%, transparent) 47%,
          color-mix(in srgb, ${HAZE} 14%, transparent) 53%,
          transparent 60%
        );
        animation: pw-skeleton-sheen 3800ms var(--motion-easing-breath) infinite;
        animation-delay: -1600ms;
      }
      @media (prefers-reduced-motion: reduce) {
        .pw-skeleton__sheen { animation: none; }
      }
    `}</style>
  );
}


function Demo() {
  const [loading, setLoading] = useState(true);
  return (
    <div>
      <SpinnerKeyframes />
      <SkeletonKeyframes />
      <h1>Spinner &amp; Skeleton</h1>
      <p>
        NewCo's loading states, brought across token-pure. The ring is three arcs
        of the mark's DNA turning steadily; the skeleton sweeps a 45&deg; band
        bottom-left to top-right, which is the brand's ascent motion rather than
        the generic sideways shimmer. Both inherit the active brand theme, so
        nothing is hardcoded per brand.
      </p>

      <h2>Ring, the NewCo loader</h2>
      <div className="row">
        {[16, 20, 24, 32, 48].map((s) => (
          <span key={s} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
            <Spinner size={s} tone="brand" />
            <span className="lbl">{s}px</span>
          </span>
        ))}
      </div>

      <h2>Every tone</h2>
      <div className="row">
        {TONES.map((t) => (
          <span key={t} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
            <Spinner size={24} tone={t} />
            <span className="lbl">{t}</span>
          </span>
        ))}
      </div>

      <h2>Sunburst, the Amplify loader, same contract</h2>
      <div className="row">
        {["light", "subtle", "base", "contrast", "bold"].map((e) => (
          <span key={e} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
            <Spinner size={24} variant="sunburst" tone="neutral" emphasis={e} />
            <span className="lbl">{e}</span>
          </span>
        ))}
      </div>

      <h2>Skeleton</h2>
      <div className="row" style={{ alignItems: "stretch" }}>
        <div className="card" style={{ width: 260, display: "flex", flexDirection: "column", gap: 12 }}>
          <Skeleton circle height={40} />
          <SkeletonText lines={3} />
        </div>
        <div className="card" style={{ width: 260, display: "flex", flexDirection: "column", gap: 12 }}>
          <Skeleton height={80} radius={12} />
          <SkeletonText lines={2} lastLineWidth="60%" />
        </div>
      </div>

      <h2>In place of real content</h2>
      <button
        onClick={() => setLoading((v) => !v)}
        style={{
          marginBottom: "var(--semantic-layout-units-gap-tight)",
          padding: "var(--semantic-layout-units-padding-xtight) var(--semantic-layout-units-padding-base)",
          fontFamily: "inherit", fontSize: "var(--semantic-type-font-size-xs)",
          borderRadius: "var(--semantic-layout-units-cornerradius-base)",
          border: "0.5px solid var(--semantic-color-stroke-static-neutral-base)",
          background: "var(--semantic-color-fill-surface-elevated)",
          color: "var(--semantic-color-foreground-static-neutral-base)", cursor: "pointer",
        }}
      >
        {loading ? "Show the content" : "Show the skeleton"}
      </button>
      <div className="card" style={{ width: 420, minHeight: 120 }}>
        {loading ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <Skeleton width="55%" height={16} />
            <SkeletonText lines={3} />
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <strong style={{ color: "var(--semantic-color-foreground-static-neutral-bold)" }}>Outstanding bills</strong>
            <p style={{ margin: 0 }}>
              12 bills totalling $24,580 awaiting approval before the end of the month.
            </p>
          </div>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
