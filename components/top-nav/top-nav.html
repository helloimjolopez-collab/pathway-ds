/* ─────────────────────────────────────────────────────────────────────────────
   TopNav.Global — Pathway Design System

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; font-family: 'Red Hat Text', sans-serif; background: #f0f2f5; }

/* ── TOPNAV SHELL ── */
.topnav {
  background: var(--semantic-color-light-mode-fill-static-brand-base, #2d4889);
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-height: 56px;
  padding: 4px 16px;
  position: relative;
  overflow: visible;
  z-index: 100;
}
.topnav__start { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.topnav__end   { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ── MODULE SWITCHER ── */
.tn-mod { position: relative; padding: 4px 2px; }
.tn-mod__inner {
  display: flex; align-items: center;
  max-height: 36px; min-height: 36px; padding: 4px; border-radius: 8px;
  background: transparent; border: 1px solid transparent; cursor: pointer; gap: 0;
  transition: background 120ms ease, border-color 120ms ease;
  font-family: 'Red Hat Text', sans-serif;
  color: var(--semantic-color-dark-mode-text-action-mono-base, #fbfbfb);
}
.tn-mod__inner:hover {
  background: var(--semantic-color-dark-mode-fill-action-primaryinverse-hover, rgba(10,18,35,0.16));
  border-color: var(--semantic-color-dark-mode-stroke-action-tertiary-hover, rgba(160,181,230,0.20));
}
.tn-mod__inner:active,
.tn-mod__inner[aria-expanded="true"] {
  background: var(--semantic-color-dark-mode-fill-action-primaryinverse-pressed, rgba(255,255,255,0.08));
  border-color: var(--semantic-color-dark-mode-stroke-action-tertiary-pressed, rgba(160,181,230,0.30));
}
.tn-mod__inner:focus-visible { outline: 2px solid rgba(160,181,230,0.7); outline-offset: 2px; }
.tn-mod__row-start { display: flex; align-items: center; gap: 4px; padding-right: 2px; }
.tn-mod__icon-wrap { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex-shrink: 0; padding: 1px; }
.tn-mod__icon-inner { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 2px; }
.tn-mod__icon-inner svg { width: 100%; height: 100%; display: block; }
.tn-mod__label { font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; color: var(--semantic-color-dark-mode-text-action-mono-base, #fbfbfb); }
.tn-mod__chev-wrap { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; padding: 2px; }
.tn-mod__chev-wrap svg { width: 100%; height: 100%; display: block; transition: transform 180ms ease; }
.tn-mod__inner[aria-expanded="true"] .tn-mod__chev-wrap svg { transform: rotate(180deg); }
.tn-mod__dropdown {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; width: 243px;
  background: #fff; border: 1px solid rgba(45,72,137,0.12); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
  padding: 4px; z-index: 300; animation: tnDropIn 140ms ease-out both;
}
.tn-mod__dropdown.is-open { display: block; }
.tn-mod__item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px;
  color: #484848; font-size: 13px; font-weight: 400;
  background: transparent; border: none; width: 100%; text-align: left;
  font-family: 'Red Hat Text', sans-serif; cursor: pointer;
  transition: background 100ms ease, color 100ms ease;
}
.tn-mod__item:hover { background: #eef2fb; color: #252525; }
.tn-mod__item--active { background: #eef2fb; color: #252525; font-weight: 500; }
.tn-mod__item--active:hover { background: #e0e7f7; }
.tn-mod__item:focus-visible { outline: 2px solid rgba(45,72,137,0.3); outline-offset: -2px; }
.tn-mod__item-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
.tn-mod__item--active .tn-mod__item-icon { opacity: 1; }

/* ── ORG SWITCHER ── */
.tn-org { position: relative; padding: 4px; max-width: 316px; min-width: 48px; }
.tn-org__inner {
  display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 4px; border-radius: 8px;
  background: var(--semantic-color-dark-mode-fill-action-tertiary-base, rgba(160,181,230,0.04));
  border: 1px solid var(--semantic-color-dark-mode-stroke-action-tertiary-base, rgba(160,181,230,0.16));
  cursor: pointer; font-family: 'Red Hat Text', sans-serif;
  color: var(--semantic-color-dark-mode-text-action-mono-base, #fbfbfb);
  transition: background 120ms ease, border-color 120ms ease;
}
.tn-org__inner:hover {
  background: var(--semantic-color-dark-mode-fill-action-primaryinverse-hover, rgba(10,18,35,0.16));
  border-color: var(--semantic-color-dark-mode-stroke-action-tertiary-hover, rgba(160,181,230,0.20));
}
.tn-org__inner:active,
.tn-org__inner[aria-expanded="true"] {
  background: var(--semantic-color-dark-mode-fill-action-primaryinverse-pressed, rgba(255,255,255,0.08));
  border-color: var(--semantic-color-dark-mode-stroke-action-tertiary-pressed, rgba(160,181,230,0.30));
}
.tn-org__inner:focus-visible { outline: 2px solid rgba(160,181,230,0.7); outline-offset: 2px; }
.tn-org__row-start { display: flex; align-items: center; gap: 4px; height: 20px; padding: 0 2px; }
.tn-org__avatar-wrap { width: 24px; height: 24px; flex-shrink: 0; padding: 2px; display: flex; align-items: center; justify-content: center; }
.tn-org__avatar {
  width: 100%; height: 100%; border-radius: 4px;
  border: 1px solid var(--semantic-color-dark-mode-stroke-action-tertiary-base, rgba(160,181,230,0.16));
  overflow: hidden; position: relative;
  background: rgba(45,72,137,0.3);
  display: flex; align-items: center; justify-content: center;
}
.tn-org__avatar img {
  /* Figma-defined crop: positions the Sacred Heart Church logo optimally */
  position: absolute; width: 196.31%; height: 228.29%; left: -47.05%; top: -63.31%;
  object-fit: cover;
}
.tn-org__avatar-fallback {
  font-size: 7px; font-weight: 700; letter-spacing: .04em;
  color: var(--semantic-color-dark-mode-text-action-mono-base, #fbfbfb); line-height: 1;
}
.tn-org__label { font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 248px; min-width: 0; color: var(--semantic-color-dark-mode-text-action-mono-base, #fbfbfb); padding-right: 4px; }
.tn-org__chev-wrap { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; padding: 2px; }
.tn-org__chev-wrap svg { width: 100%; height: 100%; display: block; transition: transform 180ms ease; }
.tn-org__inner[aria-expanded="true"] .tn-org__chev-wrap svg { transform: rotate(180deg); }
.tn-org__panel {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; width: 280px;
  background: #fff; border: 1px solid rgba(45,72,137,0.12); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
  padding: 8px; z-index: 300; animation: tnDropIn 140ms ease-out both;
}
.tn-org__panel.is-open { display: block; }
.tn-org__panel-title { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; padding: 4px 8px 6px; color: #b5b5b5; }
.tn-org__panel-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; cursor: pointer; transition: background 100ms ease; }
.tn-org__panel-item:hover { background: #eef2fb; }
.tn-org__panel-item--active { background: #eef2fb; }
.tn-org__panel-av { width: 32px; height: 32px; border-radius: 4px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #2d4889; position: relative; }
.tn-org__panel-av img { position: absolute; width: 80%; height: auto; }
.tn-org__panel-av-text { font-size: 9px; font-weight: 700; color: #fff; }
.tn-org__panel-names { min-width: 0; }
.tn-org__panel-name { font-size: 13px; font-weight: 500; color: #252525; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tn-org__panel-campus { font-size: 11px; color: #6b6b6b; margin-top: 1px; }

/* ── SEARCH (Collapsed — 32px pill) ── */
.tn-search { display: flex; align-items: center; justify-content: center; min-height: 48px; min-width: 48px; flex-shrink: 0; }
.tn-search__btn {
  display: flex; align-items: center; justify-content: center;
  height: 32px; width: 32px;
  background: var(--semantic-color-dark-mode-fill-action-primaryinverse-base, rgba(160,181,230,0.08));
  border: 0.75px solid var(--semantic-color-dark-mode-icon-action-mono-base, #fbfbfb);
  border-radius: 9999px; cursor: pointer; padding: 8px;
  transition: background 120ms ease, border-color 120ms ease; flex-shrink: 0;
}
.tn-search__btn:hover { background: var(--semantic-color-dark-mode-fill-action-primaryinverse-hover, rgba(10,18,35,0.16)); border-color: rgba(255,255,255,0.9); }
.tn-search__btn:active { background: var(--semantic-color-dark-mode-fill-action-primaryinverse-pressed, rgba(255,255,255,0.08)); }
.tn-search__btn:focus-visible { outline: 2px solid rgba(160,181,230,0.7); outline-offset: 2px; }
.tn-search__btn svg { width: 100%; height: 100%; display: block; }

/* ── ACTION ICONS ── */
.tn-actions { display: flex; align-items: center; }
.tn-action { display: flex; align-items: center; justify-content: center; min-height: 48px; min-width: 48px; padding: 6px; flex-shrink: 0; }
.tn-action__btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%; padding: 8px; border-radius: 8px;
  background: transparent; border: none; cursor: pointer; transition: background 120ms ease;
}
.tn-action__btn:hover { background: var(--semantic-color-dark-mode-fill-action-primaryinverse-hover, rgba(10,18,35,0.16)); }
.tn-action__btn:active { background: var(--semantic-color-dark-mode-fill-action-primaryinverse-pressed, rgba(255,255,255,0.08)); }
.tn-action__btn:focus-visible { outline: 2px solid rgba(160,181,230,0.7); outline-offset: 2px; border-radius: 8px; }
.tn-action__icon { width: 100%; height: 100%; overflow: hidden; border-radius: 8px; position: relative; }
.tn-action__icon-shape { position: absolute; top: 8.33%; bottom: 0; left: 16.67%; right: 16.67%; }
.tn-action__icon-shape svg { width: 100%; height: 100%; display: block; }

/* ── PROFILE ── */
.tn-profile { display: flex; align-items: center; justify-content: center; min-height: 48px; min-width: 48px; padding: 2px; flex-shrink: 0; position: relative; }
.tn-profile__btn {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; background: transparent; border: none; border-radius: 50%;
  cursor: pointer; padding: 6px; transition: background 120ms ease;
}
.tn-profile__btn:hover { background: var(--semantic-color-dark-mode-fill-action-primaryinverse-hover, rgba(10,18,35,0.16)); }
.tn-profile__btn:active, .tn-profile__btn[aria-expanded="true"] { background: var(--semantic-color-dark-mode-fill-action-primaryinverse-pressed, rgba(255,255,255,0.08)); }
.tn-profile__btn:focus-visible { outline: 2px solid rgba(160,181,230,0.7); outline-offset: 2px; border-radius: 50%; }
.tn-profile__avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--semantic-color-light-mode-fill-static-accent-amethyst-base, #dcd9ef);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; letter-spacing: 0.3px;
  color: var(--semantic-color-light-mode-text-static-accent-amethyst-contrast, #221e3f);
  line-height: 1; overflow: hidden; flex-shrink: 0;
}
.tn-profile__avatar img { width: 100%; height: 100%; object-fit: cover; }
.tn-profile__menu {
  display: none; position: absolute; top: calc(100% + 4px); right: 0; width: 200px;
  background: #fff; border: 1px solid rgba(45,72,137,0.10); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
  padding: 4px; z-index: 300; animation: tnDropIn 140ms ease-out both;
}
.tn-profile__menu.is-open { display: block; }
.tn-profile__menu-header { padding: 10px 12px 8px; border-bottom: 1px solid rgba(0,0,0,0.06); margin-bottom: 4px; }
.tn-profile__menu-name { font-size: 13px; font-weight: 600; color: #252525; }
.tn-profile__menu-email { font-size: 11px; color: #6b6b6b; margin-top: 1px; }
.tn-profile__menu-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px;
  font-family: 'Red Hat Text', sans-serif; font-size: 13px; color: #313131;
  background: transparent; border: none; width: 100%; text-align: left; cursor: pointer;
  transition: background 100ms ease;
}
.tn-profile__menu-item:hover { background: #eef2fb; }
.tn-profile__menu-item svg { width: 15px; height: 15px; flex-shrink: 0; color: #6b6b6b; }
.tn-profile__menu-item--danger { color: #c0392b; }
.tn-profile__menu-item--danger svg { color: #c0392b; }
.tn-profile__menu-item--danger:hover { background: #fff0ee; }

/* ── SIDENAV CONTROL (mobile) ── */
.tn-sidenav-ctrl { display: none; }
.tn-sidenav-ctrl__inner {
  display: flex; align-items: center; justify-content: center;
  min-height: 48px; min-width: 48px; padding: 6px; border-radius: 8px;
  background: transparent; border: none; cursor: pointer; transition: background 120ms ease;
}
.tn-sidenav-ctrl__inner:hover { background: var(--semantic-color-dark-mode-fill-action-primaryinverse-hover, rgba(10,18,35,0.16)); }

/* ── ANIMATIONS ── */
@keyframes tnDropIn {
  from { opacity: 0; transform: translateY(-4px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  @keyframes tnDropIn { from { opacity: 0; } to { opacity: 1; } }
  .tn-mod__chev-wrap svg, .tn-org__chev-wrap svg { transition: none; }
}

/* ── RESPONSIVE ── */
@media (max-width: 767px) {
  .topnav { padding: 4px 8px; }
  .tn-sidenav-ctrl { display: flex; }
  .tn-mod__label { display: none; }
  .tn-org__label { max-width: 80px; font-size: 13px; }
  .tn-actions { display: none; }
}
@media (min-width: 768px) and (max-width: 1023px) {
  .topnav { padding: 4px 12px; max-height: 54px; }
  .tn-mod__label { max-width: 100px; }
  .tn-org__label { max-width: 160px; }
}

/* ── DEMO SCAFFOLD (shown in standalone demo, hidden in Storybook) ── */
.demo-scaffold { display: flex; flex-direction: column; }
.demo-page { min-height: 200px; background: #f6f7fa; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #b5b5b5; }

/* Open-in-chrome helper */
#open-in-chrome {
  position: fixed; bottom: 16px; right: 16px; z-index: 9999;
  display: flex; align-items: center; gap: 6px; padding: 7px 13px 7px 10px;
  background: #fff; border: 1px solid #d8dce8; border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
  font-family: 'Red Hat Text', sans-serif; font-size: 12px; font-weight: 500;
  color: #2d4889; cursor: pointer; text-decoration: none;
  transition: box-shadow 0.15s ease, border-color 0.15s ease;
}
#open-in-chrome:hover { box-shadow: 0 4px 16px rgba(45,72,137,0.18); border-color: #a0b5e6; }
</style>

  </symbol>
  <symbol id="icon-menu" viewBox="0 0 18 14" fill="none">
    <path d="M1 1h16M1 7h16M1 13h16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-people" viewBox="0 0 18 18" fill="none">
    <path d="M6.5 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM1 16c0-3.038 2.462-5.5 5.5-5.5S12 12.962 12 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M12 6a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM14.5 11.5c1.933 0 3.5 1.567 3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".6"/>
  </symbol>
  <symbol id="icon-giving" viewBox="0 0 18 18" fill="none">

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── MODULES DATA ─────────────────────────────────────────────────────────────
const MODULES = [
  { id: 'home',   label: 'Amplify Home', iconId: 'icon-home' },
  { id: 'people', label: 'People',       iconId: 'icon-people' },
  { id: 'giving', label: 'Giving',       iconId: 'icon-giving' },
  { id: 'events', label: 'Events',       iconId: 'icon-events' },
  { id: 'comms',  label: 'Communications', iconId: 'icon-comms' },
];

// ─── ORG DATA ─────────────────────────────────────────────────────────────────
const ORGS = [
  { id: 'shc',        name: 'Sacred Heart Church-ITD', campus: 'Knoxville',    logoUrl: null, initials: 'SH', bg: '#2d4889' },
  { id: 'fellowship', name: 'Fellowship Church',        campus: 'Main Campus',  logoUrl: null, initials: 'FC', bg: '#22386b' },
  { id: 'grace',      name: 'Grace Community Church',   campus: 'West Campus',  logoUrl: null, initials: 'GC', bg: '#345499' },
];

// ─── ABBREVIATION UTILITIES ───────────────────────────────────────────────────
const SKIP_WORDS = new Set(['the','a','an','of','in','at','for','and','or','but']);

function abbreviateOrg(name) {
  const words = name.replace(/[-]/g, ' ').split(/\s+/).filter(w => w.length > 0);
  const significant = words.filter(w => !SKIP_WORDS.has(w.toLowerCase()));
  if (significant.length === 0) return name.slice(0,3).toUpperCase();
  if (significant.length === 1) return significant[0].slice(0,3).toUpperCase();
  if (significant.length === 2) return (significant[0][0] + significant[1][0] + significant[1][0]).toUpperCase();
  return (significant[0][0] + significant[1][0] + significant[2][0]).toUpperCase();
}

function abbreviateCampus(campus) {
  if (!campus) return '';
  const words = campus.trim().split(/\s+/);
  if (words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

// ─── ORG AVATAR ───────────────────────────────────────────────────────────────
function OrgAvatar({ org, size = 'sm' }) {
  const [imgFailed, setImgFailed] = useState(false);
  const isSmall = size === 'sm';
  const dim = isSmall ? { wrap: 24, inner: 20 } : { wrap: 32, inner: 32 };
  return (
    <div className="tn-org__avatar-wrap" style={{ width: dim.wrap, height: dim.wrap }}>
      <div className="tn-org__avatar" style={{ borderRadius: 4 }}>
        {org.logoUrl && !imgFailed ? (
          <img src={org.logoUrl} alt={`${org.name} logo`} onError={() => setImgFailed(true)} />
        ) : (
          <span className="tn-org__avatar-fallback" style={{ fontSize: isSmall ? 7 : 9 }}>
            {org.initials}
          </span>
        )}
      </div>
    </div>
  );
}

// ─── MODULE SWITCHER ──────────────────────────────────────────────────────────
function ModuleSwitcher({ activeModuleId, onModuleSelect, isOpen, onToggle }) {
  const activeModule = MODULES.find(m => m.id === activeModuleId) || MODULES[0];
  return (
    <div className="tn-mod">
      <button
        className="tn-mod__inner"
        aria-haspopup="listbox"
        aria-expanded={isOpen}
        aria-controls="tn-mod-dropdown"
        aria-label={`Switch module — ${activeModule.label}`}
        onClick={onToggle}
      >
        <div className="tn-mod__row-start">
          <div className="tn-mod__icon-wrap">
            <div className="tn-mod__icon-inner">
              <svg><use href={`#${activeModule.iconId}`}/></svg>
            </div>
          </div>
          <span className="tn-mod__label">{activeModule.label}</span>
        </div>
        <div className="tn-mod__chev-wrap">
          <svg><use href="#icon-chevron"/></svg>
        </div>
      </button>
      <ul className={`tn-mod__dropdown${isOpen ? ' is-open' : ''}`} id="tn-mod-dropdown" role="listbox" aria-label="Switch module">
        {MODULES.map(m => (
          <li key={m.id} role="option" aria-selected={m.id === activeModuleId}>
            <button
              className={`tn-mod__item${m.id === activeModuleId ? ' tn-mod__item--active' : ''}`}
              onClick={() => { onModuleSelect(m.id); }}
            >
              <span className="tn-mod__item-icon">
                <svg width="18" height="18"><use href={`#${m.iconId}`}/></svg>
              </span>
              {m.label}
            </button>
          </li>
        ))}
      </ul>
    </div>
  );
}

// ─── ORG SWITCHER ─────────────────────────────────────────────────────────────
function OrgSwitcher({ activeOrgId, onOrgSelect, isOpen, onToggle, mobile }) {
  const activeOrg = ORGS.find(o => o.id === activeOrgId) || ORGS[0];
  const label = mobile
    ? abbreviateOrg(activeOrg.name) + (activeOrg.campus ? ' | ' + abbreviateCampus(activeOrg.campus) : '')
    : activeOrg.name + (activeOrg.campus ? ' | ' + activeOrg.campus : '');
  const ariaLabel = `Switch organisation — ${activeOrg.name}${activeOrg.campus ? ', ' + activeOrg.campus : ''}`;
  return (
    <div className="tn-org" style={{ maxWidth: mobile ? 160 : 316 }}>
      <button
        className="tn-org__inner"
        aria-haspopup="true"
        aria-expanded={isOpen}
        aria-controls="tn-org-panel"
        aria-label={ariaLabel}
        onClick={onToggle}
      >
        <div className="tn-org__row-start">
          <OrgAvatar org={activeOrg} size="sm" />
          <span className="tn-org__label" aria-hidden={mobile ? "true" : undefined}>{label}</span>
        </div>
        <div className="tn-org__chev-wrap">
          <svg><use href="#icon-chevron"/></svg>
        </div>
      </button>
      <div className={`tn-org__panel${isOpen ? ' is-open' : ''}`} id="tn-org-panel" role="dialog" aria-label="Switch organisation">
        <div className="tn-org__panel-title">Organisations</div>
        {ORGS.map(org => (
          <div
            key={org.id}
            className={`tn-org__panel-item${org.id === activeOrgId ? ' tn-org__panel-item--active' : ''}`}
            role="option"
            aria-selected={org.id === activeOrgId}
            onClick={() => onOrgSelect(org.id)}
            tabIndex={0}
            onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') onOrgSelect(org.id); }}
          >
            <div className="tn-org__panel-av" style={{ background: org.bg }}>
              {org.logoUrl
                ? <img src={org.logoUrl} alt={`${org.name} logo`} />
                : <span className="tn-org__panel-av-text">{org.initials}</span>
              }
            </div>
            <div className="tn-org__panel-names">
              <div className="tn-org__panel-name">{org.name}</div>
              {org.campus && <div className="tn-org__panel-campus">{org.campus}</div>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── PROFILE MENU ─────────────────────────────────────────────────────────────
function ProfileMenu({ isOpen, onToggle, user }) {
  return (
    <div className="tn-profile">
      <button
        className="tn-profile__btn"
        aria-haspopup="true"
        aria-expanded={isOpen}
        aria-controls="tn-profile-menu"
        aria-label={`Account — ${user.name}`}
        onClick={onToggle}
      >
        <div className="tn-profile__avatar">
          {user.avatarUrl
            ? <img src={user.avatarUrl} alt={user.name} />
            : user.initials
          }
        </div>
      </button>
      <div className={`tn-profile__menu${isOpen ? ' is-open' : ''}`} id="tn-profile-menu" role="menu">
        <div className="tn-profile__menu-header">
          <div className="tn-profile__menu-name">{user.name}</div>
          <div className="tn-profile__menu-email">{user.email}</div>
        </div>
        <button className="tn-profile__menu-item" role="menuitem">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" strokeWidth="1.3"/><path d="M3 13.5c0-2.485 2.015-4.5 5-4.5s5 2.015 5 4.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
          Profile settings
        </button>
        <button className="tn-profile__menu-item" role="menuitem">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" stroke="currentColor" strokeWidth="1.3"/><path d="M8 3v1M8 12v1M3 8H2M14 8h-1M4.757 4.757l.707.707M10.536 10.536l.707.707M4.757 11.243l.707-.707M10.536 5.464l.707-.707" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
          Settings
        </button>
        <button className="tn-profile__menu-item tn-profile__menu-item--danger" role="menuitem">
          <svg viewBox="0 0 16 16" fill="none"><path d="M10 3h3v10h-3M6 11l-4-4 4-4M2 7h8" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
          Sign out
        </button>
      </div>
    </div>
  );
}

// ─── TOP NAV ROOT ─────────────────────────────────────────────────────────────
function TopNav({
  modules = MODULES,
  activeModuleId: initialModuleId = 'home',
  orgs = ORGS,
  activeOrgId: initialOrgId = 'shc',
  user = { name: 'Jo Lopez', initials: 'JL', email: 'jo@sacredheart.org' },
  onSideNavToggle,
  onSearchOpen,
  onModuleSelect,
  onOrgSelect,
}) {
  const [activeModuleId, setActiveModuleId] = useState(initialModuleId);
  const [activeOrgId, setActiveOrgId]       = useState(initialOrgId);
  const [openPanel, setOpenPanel]           = useState(null); // 'module'|'org'|'profile'|null
  const navRef = useRef(null);

  const toggle = (panel) => setOpenPanel(p => p === panel ? null : panel);
  const close  = () => setOpenPanel(null);

  // Click outside
  useEffect(() => {
    const handler = (e) => {
      if (navRef.current && !navRef.current.contains(e.target)) close();
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  // Escape key
  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  const handleModuleSelect = (id) => {
    setActiveModuleId(id);
    close();
    onModuleSelect?.(id);
  };
  const handleOrgSelect = (id) => {
    setActiveOrgId(id);
    close();
    onOrgSelect?.(id);
  };

  // Detect mobile for responsive label
  const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
  useEffect(() => {
    const mq = window.matchMedia('(max-width: 767px)');
    const handler = (e) => setIsMobile(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, []);

  return (
    <nav className="topnav" aria-label="Global navigation" ref={navRef}>
      <div className="topnav__start">
        {/* SideNav.Control — mobile only */}
        <div className="tn-sidenav-ctrl">
          <button className="tn-sidenav-ctrl__inner" aria-label="Open navigation menu" onClick={onSideNavToggle}>
            <svg width="18" height="14"><use href="#icon-menu"/></svg>
          </button>
        </div>
        <ModuleSwitcher
          activeModuleId={activeModuleId}
          onModuleSelect={handleModuleSelect}
          isOpen={openPanel === 'module'}
          onToggle={() => toggle('module')}
        />
        <OrgSwitcher
          activeOrgId={activeOrgId}
          onOrgSelect={handleOrgSelect}
          isOpen={openPanel === 'org'}
          onToggle={() => toggle('org')}
          mobile={isMobile}
        />
      </div>
      <div className="topnav__end">
        <div className="tn-search">
          <button className="tn-search__btn" aria-label="Open search" onClick={onSearchOpen}>
            <svg><use href="#icon-search-sm"/></svg>
          </button>
        </div>
        <div className="tn-actions">
          <div className="tn-action">
            <button className="tn-action__btn" aria-label="Notifications">
              <div className="tn-action__icon">
                <div className="tn-action__icon-shape"><svg><use href="#icon-bell"/></svg></div>
              </div>
            </button>
          </div>
          <div className="tn-action">
            <button className="tn-action__btn" aria-label="Alerts">
              <div className="tn-action__icon">
                <div className="tn-action__icon-shape"><svg><use href="#icon-bell"/></svg></div>
              </div>
            </button>
          </div>
        </div>
        <ProfileMenu
          isOpen={openPanel === 'profile'}
          onToggle={() => toggle('profile')}
          user={user}
        />
      </div>
    </nav>
  );
}

// ─── STANDALONE DEMO ──────────────────────────────────────────────────────────
function Demo() {
  return (
    <div className="demo-scaffold">
      <TopNav />
      <div className="demo-page">Page content area</div>
    </div>
  );
}

ReactDOM.render(<Demo />, document.getElementById('root'));
</script>

  Open in Chrome
</a>
