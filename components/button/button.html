<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button — Pathway Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <!-- Pathway tokens: the real built CSS. Never inline a hand-copied subset -->
  <link rel="stylesheet" href="../../src/tokens/primitives.css" />
  <link rel="stylesheet" href="../../src/tokens/themes/light.css" />
  <link rel="stylesheet" href="../../src/tokens/themes/midnight.css" />
  <link rel="stylesheet" href="../../src/tokens/layout.css" />
  <link rel="stylesheet" href="../../src/tokens/layout-contextual.css" />
  <link rel="stylesheet" href="../../src/tokens/type.css" />
  <link rel="stylesheet" href="../../src/tokens/motion.css" />
  <link rel="stylesheet" href="../../src/tokens/breakpoints.css" />
<style>

  /* ── Spinner animation ── */
  @keyframes pw-btn-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pw-btn-spinner { animation: none !important; }
  }

  /* ── Material Symbols config ── */
  .material-symbols-rounded {
    font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 20;
    font-size: inherit;
    line-height: 1;
    display: inline-block;
    vertical-align: middle;
    letter-spacing: normal;
    word-wrap: normal;
    white-space: nowrap;
    direction: ltr;
  }

  /* ── Demo chrome (not part of component) ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Red Hat Text", sans-serif; background: #f7f8fc; color: #02060d; }
  .demo-shell  { max-width: 1100px; margin: 0 auto; padding: 48px 32px 80px; }
  .demo-title  { font-size: 22px; font-weight: 600; line-height: 28px; margin-bottom: 4px; }
  .demo-sub    { font-size: 13px; color: #7880a0; margin-bottom: 40px; }
  .demo-section { background: #fff; border: 1px solid #edf0f9; border-radius: 12px;
                  padding: 24px 28px; margin-bottom: 20px; }
  .demo-section-label { font-size: 10px; font-weight: 700; color: #7880a0;
                        text-transform: uppercase; letter-spacing: .1em; margin-bottom: 16px; }
  .demo-row    { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .demo-row:last-child { margin-bottom: 0; }
  .demo-row-label { font-size: 11px; color: #a0a8c0; width: 72px; flex-shrink: 0; }
  .demo-dark   { background: #1b2544; }
</style>
</head>
<body>
<div class="demo-shell">
  <div id="root"></div>
</div>

<script type="text/babel">
const { useState, useEffect } = React;

// Every name below is MODELESS. The mode resolves by selector from
// themes/light.css and themes/midnight.css, so there is no "light-mode"
// segment and no *inverse* family: an inverted button is this same button
// inside a [data-theme="midnight"] region. See CLAUDE.md section 2.0.
const SC = (p) => `var(--semantic-color-${p})`;
const SL = (p) => `var(--semantic-layout-units-${p})`;
const CL = (p) => `var(--contextual-layout-units-${p})`;
const ST = (p) => `var(--semantic-type-${p})`;

// Tertiary reads Primary Dim (its own family was deleted for duplicating it),
// Negative moved under Status, and Disabled is one token per tier.
const FILL = {
  Fill: {
    Primary:   { base: SC("fill-action-primary-rest"),         hover: SC("fill-action-primary-hover"),         pressed: SC("fill-action-primary-pressed"),         disabled: SC("fill-action-disabled") },
    Secondary: { base: SC("fill-action-secondary-rest"),       hover: SC("fill-action-secondary-hover"),       pressed: SC("fill-action-secondary-pressed"),       disabled: SC("fill-action-disabled") },
    Tertiary:  { base: SC("fill-action-primary-dim-rest"),     hover: SC("fill-action-primary-dim-hover"),     pressed: SC("fill-action-primary-dim-pressed"),     disabled: SC("fill-action-disabled") },
    Negative:  { base: SC("fill-action-status-negative-rest"), hover: SC("fill-action-status-negative-hover"), pressed: SC("fill-action-status-negative-pressed"), disabled: SC("fill-action-disabled") },
  },
  Outlined: {
    Primary:   { base: "transparent", hover: SC("fill-action-primary-dim-hover"),         pressed: SC("fill-action-primary-dim-pressed"),         disabled: "transparent" },
    Secondary: { base: "transparent", hover: SC("fill-action-secondary-hover"),           pressed: SC("fill-action-secondary-pressed"),           disabled: "transparent" },
    Tertiary:  { base: "transparent", hover: SC("fill-action-primary-dim-hover"),         pressed: SC("fill-action-primary-dim-pressed"),         disabled: "transparent" },
    Negative:  { base: "transparent", hover: SC("fill-action-status-negative-dim-hover"), pressed: SC("fill-action-status-negative-dim-pressed"), disabled: "transparent" },
  },
};
FILL.Naked = FILL.Outlined;

// Text and Icon merged into Foreground: a button is one interactive surface,
// so label and icon must not resolve through two ramps that can drift apart.
// Mono has only a rest step - white stays white through hover and pressed.
const FG = {
  Fill: {
    Primary:   { base: SC("foreground-action-mono-rest"),            hover: SC("foreground-action-mono-rest"),            pressed: SC("foreground-action-mono-rest"),            disabled: SC("foreground-action-disabled") },
    Secondary: { base: SC("foreground-action-secondary-rest"),       hover: SC("foreground-action-secondary-hover"),       pressed: SC("foreground-action-secondary-pressed"),       disabled: SC("foreground-action-disabled") },
    Tertiary:  { base: SC("foreground-action-primary-rest"),         hover: SC("foreground-action-primary-hover"),         pressed: SC("foreground-action-primary-pressed"),         disabled: SC("foreground-action-disabled") },
    Negative:  { base: SC("foreground-action-mono-rest"),            hover: SC("foreground-action-mono-rest"),            pressed: SC("foreground-action-mono-rest"),            disabled: SC("foreground-action-disabled") },
  },
  Outlined: {
    Primary:   { base: SC("foreground-action-primary-rest"),         hover: SC("foreground-action-primary-hover"),         pressed: SC("foreground-action-primary-pressed"),         disabled: SC("foreground-action-disabled") },
    Secondary: { base: SC("foreground-action-secondary-rest"),       hover: SC("foreground-action-secondary-hover"),       pressed: SC("foreground-action-secondary-pressed"),       disabled: SC("foreground-action-disabled") },
    Tertiary:  { base: SC("foreground-action-primary-rest"),         hover: SC("foreground-action-primary-hover"),         pressed: SC("foreground-action-primary-pressed"),         disabled: SC("foreground-action-disabled") },
    Negative:  { base: SC("foreground-action-status-negative-rest"), hover: SC("foreground-action-status-negative-hover"), pressed: SC("foreground-action-status-negative-pressed"), disabled: SC("foreground-action-disabled") },
  },
};
FG.Naked = FG.Outlined;
const TEXT = FG;
const ICON_T = FG;

// No Primary Dim stroke ramp exists, so Tertiary borrows the Primary stroke.
const STROKE = {
  Primary:   { base: SC("stroke-action-primary-rest"),         hover: SC("stroke-action-primary-hover"),         pressed: SC("stroke-action-primary-pressed"),         disabled: SC("stroke-action-disabled") },
  Secondary: { base: SC("stroke-action-secondary-rest"),       hover: SC("stroke-action-secondary-hover"),       pressed: SC("stroke-action-secondary-pressed"),       disabled: SC("stroke-action-disabled") },
  Tertiary:  { base: SC("stroke-action-primary-rest"),         hover: SC("stroke-action-primary-hover"),         pressed: SC("stroke-action-primary-pressed"),         disabled: SC("stroke-action-disabled") },
  Negative:  { base: SC("stroke-action-status-negative-rest"), hover: SC("stroke-action-status-negative-hover"), pressed: SC("stroke-action-status-negative-pressed"), disabled: SC("stroke-action-disabled") },
};

const FOCUS_RING = `0 0 0 6px #ffffff, 0 0 0 8px ${SC("stroke-focusring-base")}`;

// Type is a scale now, so each size composes its own five values. The px in
// each comment is what the retired Label/Button composite resolved to.
const LABEL = (size, lineHeight) => ({
  fontFamily:    ST("family-brand"),
  fontSize:      ST(`font-size-${size}`),
  fontWeight:    ST("weight-medium"),
  lineHeight:    ST(`line-height-${lineHeight}`),
  letterSpacing: ST("letter-spacing-compact"),
});

const SIZES = {
  L: { padH: CL("button-padding-large-horizontal"),  padV: CL("button-padding-large-vertical"),  iconWrap: 26, iconInner: 18, ...LABEL("m",  "m-single")  },  // 18 / 24
  M: { padH: CL("button-padding-medium-horizontal"), padV: CL("button-padding-medium-vertical"), iconWrap: 24, iconInner: 16, ...LABEL("r",  "r-single")  },  // 16 / 22
  S: { padH: CL("button-padding-small-horizontal"),  padV: CL("button-padding-small-vertical"),  iconWrap: 20, iconInner: 14, ...LABEL("s",  "s-single")  },  // 14 / 20
  XS:{ padH: CL("button-padding-xsmall-horizontal"), padV: CL("button-padding-xsmall-vertical"), iconWrap: 16, iconInner: 12, ...LABEL("xs", "xs-single") },  // 12 / 18
};

const T = {
  radius: CL("button-radius-radius"),
  border: CL("button-border-width-base-base"),
  gap:    CL("button-gap-horizontal"),
  touch:  { pad: 6, min: 48 },
  focusShadow: FOCUS_RING,
};

// ─── SPINNER ──────────────────────────────────────────────────────────────────
const SPOKES = [
  { d: "M6 1V3",             o: 1.00 },
  { d: "M8.1 3.9L9.55 2.45", o: 0.87 },
  { d: "M9 6H11",            o: 0.75 },
  { d: "M8.1 8.1L9.55 9.55", o: 0.62 },
  { d: "M6 9V11",            o: 0.50 },
  { d: "M2.45 9.55L3.9 8.1", o: 0.37 },
  { d: "M1 6H3",             o: 0.25 },
  { d: "M2.45 2.45L3.9 3.9", o: 0.12 },
];
function BtnSpinner({ size = 20 }) {
  return (
    <svg className="pw-btn-spinner" width={size} height={size} viewBox="0 0 12 12" aria-hidden="true"
      style={{ animation: "pw-btn-spin var(--motion-duration-loop-fast) var(--motion-easing-linear) infinite", flexShrink: 0, display: "block" }}>
      {SPOKES.map((s, i) => (
        <path key={i} d={s.d} stroke="currentColor" strokeWidth="1" strokeLinecap="round" fill="none" opacity={s.o} />
      ))}
    </svg>
  );
}

// ─── BUTTON COMPONENT ─────────────────────────────────────────────────────────
function Button({ buttonStyle = "Fill", size = "M", type = "Primary", text = "Button",
                  leadingIcon = null, trailingIcon = null,
                  showLeadingIcon = false, showTrailingIcon = false, showText = true,
                  loading = false, disabled = false, onClick, ariaLabel, className = "" }) {
  const [hovered, setHovered] = useState(false);
  const [pressed, setPressed] = useState(false);
  const [focused, setFocused] = useState(false);

  const isDisabled = disabled || loading;
  const stateKey   = isDisabled ? "disabled" : pressed ? "pressed" : hovered ? "hover" : "base";

  const fillT  = FILL[buttonStyle]?.[type]  || FILL.Fill.Primary;
  const textT  = TEXT[buttonStyle]?.[type]  || TEXT.Fill.Primary;
  const iconT  = ICON_T[buttonStyle]?.[type] || ICON_T.Fill.Primary;
  const strokeT = STROKE[type] || STROKE.Primary;
  const sz     = SIZES[size] || SIZES.M;

  const bgColor    = fillT[stateKey];
  const textColor  = textT[stateKey];
  const iconColor  = iconT[stateKey];
  const strokeColor = strokeT[stateKey];
  const hasStroke  = buttonStyle === "Outlined";

  const outerS = {
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    padding: T.touch.pad, minHeight: T.touch.min, minWidth: T.touch.min,
    background: "transparent", border: "none", borderRadius: T.radius,
    cursor: isDisabled ? "not-allowed" : "pointer", outline: "none",
  };
  const innerS = {
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    paddingLeft: sz.padH, paddingRight: sz.padH,
    paddingTop: sz.padV, paddingBottom: sz.padV,
    borderRadius: T.radius,
    backgroundColor: bgColor,
    border: hasStroke ? `${T.border} solid ${strokeColor}` : "none",
    gap: 0, flex: "1 0 0", minWidth: 0, color: iconColor,
    boxShadow: focused && !isDisabled ? T.focusShadow : "none",
    transition: "background-color var(--motion-duration-2) var(--motion-easing-standard), border-color var(--motion-duration-2) var(--motion-easing-standard), box-shadow var(--motion-duration-2) var(--motion-easing-standard), color var(--motion-duration-2) var(--motion-easing-standard)",
  };
  // Figma's Container.Label carries pad=[0,4,0,4]. That half-gap on each side
  // is what separates the label from an adjacent icon, and what keeps a
  // text-only button symmetric. Container.Main's own gap stays 0 (see innerS)
  // so the separation is not counted twice.
  const labelS = {
    fontFamily: sz.fontFamily, fontWeight: sz.fontWeight, fontSize: sz.fontSize,
    lineHeight: sz.lineHeight, letterSpacing: sz.letterSpacing,
    paddingLeft: `calc(${T.gap} / 2)`, paddingRight: `calc(${T.gap} / 2)`,
    color: textColor, whiteSpace: "nowrap", userSelect: "none",
    transition: "color var(--motion-duration-2) var(--motion-easing-standard)",
  };
  const iconWrapS = {
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    width: sz.iconWrap, height: sz.iconWrap, flexShrink: 0,
    fontSize: sz.iconInner, color: iconColor, transition: "color var(--motion-duration-2) var(--motion-easing-standard)",
  };

  return (
    <button type="button" onClick={!isDisabled ? onClick : undefined}
      disabled={isDisabled} aria-label={ariaLabel || (showText ? undefined : text)}
      aria-busy={loading || undefined}
      onMouseEnter={() => !isDisabled && setHovered(true)}
      onMouseLeave={() => { setHovered(false); setPressed(false); }}
      onMouseDown={() => !isDisabled && setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onFocus={() => setFocused(true)}
      onBlur={() => { setFocused(false); setPressed(false); }}
      className={className} style={outerS}>
      <span style={innerS}>
        {loading ? (
          <BtnSpinner size={Math.round(sz.iconInner * 1.2)} />
        ) : (
          <>
            {showLeadingIcon && (
              <span className="material-symbols-rounded" style={iconWrapS} aria-hidden="true">
                {leadingIcon || "add"}
              </span>
            )}
            {showText && <span style={labelS}>{text}</span>}
            {showTrailingIcon && (
              <span className="material-symbols-rounded" style={iconWrapS} aria-hidden="true">
                {trailingIcon || "arrow_forward"}
              </span>
            )}
          </>
        )}
      </span>
    </button>
  );
}

// ─── DEMO APP ─────────────────────────────────────────────────────────────────
const TYPES = ["Primary", "Secondary", "Tertiary", "Negative"];
const STYLES = ["Fill", "Outlined", "Naked"];
const SIZES_LIST = ["L", "M", "S", "XS"];

function DemoRow({ label, children }) {
  return (
    <div className="demo-row">
      <span className="demo-row-label">{label}</span>
      {children}
    </div>
  );
}

function App() {
  return (
    <div className="demo-shell">
      <h1 className="demo-title">Button</h1>
      <p className="demo-sub">Pathway Design System · Figma node 40003293:93741 · All states interactive</p>

      {STYLES.map(style => (
        <div key={style} className="demo-section">
          <div className="demo-section-label">{style}</div>
          {TYPES.map(type => (
            <DemoRow key={type} label={type}>
              {/* Default */}
              <Button buttonStyle={style} type={type} size="M" text="Button" />
              {/* With leading icon */}
              <Button buttonStyle={style} type={type} size="M" text="Button" showLeadingIcon leadingIcon="add" />
              {/* Trailing icon only */}
              <Button buttonStyle={style} type={type} size="M" text="Button" showTrailingIcon trailingIcon="arrow_forward" />
              {/* Disabled */}
              <Button buttonStyle={style} type={type} size="M" text="Disabled" disabled />
              {/* Loading */}
              <Button buttonStyle={style} type={type} size="M" loading />
            </DemoRow>
          ))}
          <div style={{ borderTop: "1px solid #edf0f9", margin: "16px 0 16px" }} />
          {/* Size comparison */}
          <DemoRow label="Sizes">
            {SIZES_LIST.map(sz => (
              <Button key={sz} buttonStyle={style} type="Primary" size={sz} text={sz} />
            ))}
          </DemoRow>
        </div>
      ))}

      {/* Icon-only buttons */}
      <div className="demo-section">
        <div className="demo-section-label">Icon-only (touch target demonstrated)</div>
        <DemoRow label="Icon only">
          {TYPES.map(type => (
            <Button key={type} buttonStyle="Fill" type={type} size="M"
              showLeadingIcon leadingIcon="add" showText={false}
              ariaLabel={`Add (${type})`} />
          ))}
        </DemoRow>
        <DemoRow label="Naked icon">
          {TYPES.map(type => (
            <Button key={type} buttonStyle="Naked" type={type} size="M"
              showLeadingIcon leadingIcon="more_vert" showText={false}
              ariaLabel={`More options (${type})`} />
          ))}
        </DemoRow>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
